# no-marathon.kr — Vultr 단일 인스턴스 배포용 compose
# 사용: docker compose up -d --build
# live 빌드는 NEXT_PUBLIC_* 을 build args 로 주입(아래 args). 서버 secret 은 env_file.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-mock}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
